name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: 依存ライブラリの脆弱性検査
        run: pip-audit -r requirements.txt
      - name: 質問セットと資料の整合チェック
        run: python eval/run_eval.py --check
      - name: 検索の評価
        run: python eval/retrieval_eval.py --top-k 5
      - name: テスト
        run: python -m pytest -q
