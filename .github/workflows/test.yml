name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: OCR（スキャンしたPDF・会議の画面の名前を読む）と日本語フォントの準備
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-jpn poppler-utils fonts-ipafont-gothic
      - run: pip install -r requirements-dev.txt
      - name: 依存ライブラリの脆弱性検査
        run: pip-audit -r requirements.txt
      - name: 質問セットと資料の整合チェック
        run: python eval/run_eval.py --check
      - name: 検索の評価
        run: python eval/retrieval_eval.py --top-k 5
      - name: テスト
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 依存ライブラリの脆弱性検査は2段にする（README「依存ライブラリと…」）
      # 1段目：配る画面に入るもの（dependencies）。指摘があれば止める
      - name: 依存ライブラリの脆弱性検査（配る画面に入るもの）
        run: npm audit --omit=dev
      # 2段目：組み立て・テストの道具（devDependencies）も含めた全部。指摘があっても止めず、警告として出す
      - name: 依存ライブラリの脆弱性検査（開発用の道具を含む全部。止めない）
        id: audit_all
        continue-on-error: true
        run: npm audit
      - name: 全部の検査の指摘を警告として出す
        if: steps.audit_all.outcome == 'failure'
        run: echo "::warning title=npm audit（開発用の道具を含む）::開発用の道具に既知の脆弱性の指摘があります。配る画面には入りませんが、直った版が出たら上げてください。中身は前のステップのログを見てください。"
      - name: 画面のテスト
        run: npm test
      - name: 型の確認と組み立て
        run: npm run build
